[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fortress"
version = "3.0.0"
description = "Cryptographically secure password / passphrase / PIN generator with entropy analysis, HIBP breach checks, and a FastAPI server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Hatim El Hassak", email = "hatimelhassak.official@gmail.com" }]
keywords = [
    "password", "passphrase", "pin", "generator", "security",
    "cryptography", "entropy", "diceware", "hibp", "cli", "fastapi",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.scripts]
fortress = "fortress.cli:main"

[project.urls]
Homepage = "https://github.com/hatimhtm/Fortress"
Repository = "https://github.com/hatimhtm/Fortress"
Issues = "https://github.com/hatimhtm/Fortress/issues"
Changelog = "https://github.com/hatimhtm/Fortress/releases"

[tool.hatch.build.targets.wheel]
packages = ["fortress"]

[tool.hatch.build.targets.wheel.force-include]
"fortress/data/eff_large_wordlist.txt" = "fortress/data/eff_large_wordlist.txt"
"fortress/data/common_passwords.txt" = "fortress/data/common_passwords.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=fortress --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "SIM", "C4", "S"]
ignore = [
    "E501",   # handled by formatter
    "S101",   # assert in tests is fine
    "S104",   # `fortress serve --host 0.0.0.0` is the explicit point of the command
    "S310",   # urllib.request.urlopen — we only call HIBP, which is https
    "S324",   # SHA-1 is mandated by the HIBP API protocol (range/<prefix>)
    "S603",   # subprocess call — clipboard helpers
    "S607",   # partial path for system tools (pbcopy etc.) — that's the point
    "B008",   # typer/fastapi default-call idiom
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument", "typer.Option",
    "fastapi.Query", "fastapi.Body", "fastapi.Path",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hardcoded passwords in tests are fine

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true
